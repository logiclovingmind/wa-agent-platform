<!--
  The initials, in the wordmark's own letterforms.

  The three glyphs are lifted unchanged from wordmark.svg — the L of LOGIC, the L of LOVING
  and the M of MIND — and only translated, so this cannot drift from the full lockup the way
  a redrawn or refonted version would. The full wordmark is twenty times wider than it is
  tall and only fits on the sign-in screen; this is what goes in a 224px sidebar.

  Spacing is the original's own letter tracking (~34 units), measured between glyph boxes.
-->
