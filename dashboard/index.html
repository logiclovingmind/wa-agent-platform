<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1c1c" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <!-- iOS ignores the manifest for installation and reads these instead. Without the
         first one, "Add to Home Screen" produces a Safari bookmark, not an app. It also
         ignores SVG favicons, hence the PNG here. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dashboard" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Dashboard — Logic Loving Mind</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
